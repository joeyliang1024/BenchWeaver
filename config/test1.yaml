### OpenAI Source
openai_source: "azure"
### inference model
inference_model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
inference_mode: local
### checker model
#checker_model_name_or_path: Qwen/Qwen2.5-32B-Instruct
#check_mode: local
checker_model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
check_mode: local

### source dataset
task: medmcqa_test
task_dir: evaluation_data
lang: en
benchmark_mode: opqa
pipeline: same
n_shot: 0
cot: false
### output
save_dir: score/medmcqa_test

### VLLM 
vllm_maxlen: 8192
vllm_max_concurrency: 30
max_new_tokens: 2048
dtype: float16
### debug
debug: true
record_all: true
