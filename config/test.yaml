### OpenAI Source
openai_source: "azure"

### inference model
inference_model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
inference_mode: local
cot: false

### checker model
#checker_model_name_or_path: Qwen/Qwen2.5-32B-Instruct
#check_mode: local
checker_model_name_or_path: gpt-4o-mini
check_mode: api

### source dataset
task: history_test
task_dir: evaluation_data
lang: zh-tw
benchmark_mode: opqa
pipeline: same

### output
save_dir: score/test_history

### VLLM 
vllm_maxlen: 8192
vllm_max_concurrency: 30
max_new_tokens: 2048
dtype: float16
### debug
debug: true
record_all: true
